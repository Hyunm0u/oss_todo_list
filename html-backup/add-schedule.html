<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StudyFlow - 일정 추가</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900">
  <div class="min-h-screen bg-slate-50 p-6">
    <header class="mb-6 rounded-3xl bg-white p-6 shadow-lg">
      <h1 class="text-3xl font-bold">일정 추가</h1>
      <p class="mt-2 text-slate-500">새 작업 또는 일정을 빠르게 등록하세요.</p>
    </header>

    <form class="space-y-6 rounded-3xl bg-white p-6 shadow-sm">
      <div>
        <label class="mb-2 block text-sm font-medium text-slate-600">제목</label>
        <input class="w-full rounded-3xl border border-slate-200 bg-slate-50 p-4" placeholder="3장 읽기" />
      </div>

      <div>
        <p class="mb-3 text-sm font-medium text-slate-600">카테고리</p>
        <div class="grid gap-3 sm:grid-cols-2 lg:grid-cols-4">
          <button type="button" class="rounded-3xl border border-slate-200 bg-slate-50 p-4 text-left">공부</button>
          <button type="button" class="rounded-3xl border border-slate-200 bg-slate-50 p-4 text-left">독서</button>
          <button type="button" class="rounded-3xl border border-slate-200 bg-slate-50 p-4 text-left">운동</button>
          <button type="button" class="rounded-3xl border border-slate-200 bg-slate-50 p-4 text-left">기타</button>
        </div>
      </div>

      <div class="grid gap-4 sm:grid-cols-3">
        <label class="space-y-2 text-sm text-slate-600">
          <span>날짜</span>
          <input type="date" class="field-input w-full rounded-3xl border border-slate-200 bg-slate-50 p-4" />
        </label>
        <label class="space-y-2 text-sm text-slate-600">
          <span>시작</span>
          <input type="time" class="field-input w-full rounded-3xl border border-slate-200 bg-slate-50 p-4" />
        </label>
        <label class="space-y-2 text-sm text-slate-600">
          <span>종료</span>
          <input type="time" class="field-input w-full rounded-3xl border border-slate-200 bg-slate-50 p-4" />
        </label>
      </div>

      <div>
        <label class="mb-2 block text-sm font-medium text-slate-600">메모</label>
        <textarea class="w-full rounded-3xl border border-slate-200 bg-slate-50 p-4" rows="5" placeholder="유용한 메모를 추가하세요"></textarea>
      </div>

      <div class="grid gap-4 sm:grid-cols-2">
        <button type="button" class="rounded-3xl border border-slate-200 bg-white p-4 text-slate-700">취소</button>
        <button type="submit" class="rounded-3xl bg-slate-900 p-4 text-white">저장</button>
      </div>
    </form>
  </div>
</body>
</html>
