<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StudyFlow - 설정</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900">
  <div class="min-h-screen bg-slate-50 p-6">
    <header class="mb-8 rounded-3xl bg-white p-6 shadow-lg">
      <h1 class="text-3xl font-bold">설정</h1>
      <p class="mt-2 text-slate-500">앱 환경과 알림을 관리하세요.</p>
    </header>

    <section class="mb-6 rounded-3xl bg-white p-6 shadow-sm">
      <div class="flex items-center gap-4">
        <div class="flex h-16 w-16 items-center justify-center rounded-3xl bg-slate-100 text-3xl">S</div>
        <div>
          <h2 class="text-xl font-semibold">StudyFlow</h2>
          <p class="mt-1 text-slate-500">24 작업 · 8 일정</p>
        </div>
        <span class="ml-auto rounded-full bg-slate-100 px-4 py-2 text-sm">v2.4.0</span>
      </div>
    </section>

    <section class="mb-6 rounded-3xl bg-white p-6 shadow-sm">
      <h2 class="text-lg font-semibold">외관</h2>
      <div class="mt-4 grid gap-3 sm:grid-cols-3">
        <button class="rounded-3xl border border-slate-200 bg-slate-50 p-4">밝게</button>
        <button class="rounded-3xl border border-slate-200 bg-slate-50 p-4">어둡게</button>
        <button class="rounded-3xl border border-slate-200 bg-slate-50 p-4">시스템</button>
      </div>
    </section>

    <section class="mb-6 rounded-3xl bg-white p-6 shadow-sm">
      <h2 class="text-lg font-semibold">AI 기능</h2>
      <p class="mt-3 text-slate-600">AI 하루 메시지를 켜면 매일 동기부여를 받을 수 있습니다.</p>
      <button class="mt-4 rounded-3xl bg-slate-900 px-5 py-3 text-white">AI 사용 켜기</button>
    </section>

    <section class="mb-6 rounded-3xl bg-white p-6 shadow-sm">
      <h2 class="text-lg font-semibold">알림</h2>
      <nav class="mt-4 space-y-3">
        <a class="block rounded-3xl border border-slate-200 p-4 hover:bg-slate-50" href="/notifications/category">카테고리 알림</a>
        <a class="block rounded-3xl border border-slate-200 p-4 hover:bg-slate-50" href="/notifications/time">시간대 알림</a>
        <a class="block rounded-3xl border border-slate-200 p-4 hover:bg-slate-50" href="/notifications/dnd">방해 금지</a>
      </nav>
    </section>

    <section class="rounded-3xl bg-white p-6 shadow-sm">
      <h2 class="text-lg font-semibold">데이터</h2>
      <button class="mt-4 w-full rounded-3xl border border-red-300 bg-red-50 p-4 text-red-700">모든 데이터 초기화</button>
    </section>
  </div>
</body>
</html>
