<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StudyFlow - 시간대 알림</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900">
  <div class="min-h-screen bg-slate-50 p-6">
    <header class="mb-8 rounded-3xl bg-white p-6 shadow-lg">
      <h1 class="text-3xl font-bold">시간대 알림</h1>
      <p class="mt-2 text-slate-500">하루 중 특정 시간대 알림을 조절합니다.</p>
    </header>

    <section class="mb-8 rounded-3xl bg-white p-6 shadow-sm">
      <h2 class="text-xl font-semibold">저장된 시간대</h2>
      <div class="mt-4 space-y-4">
        <article class="rounded-3xl border border-slate-200 p-4">
          <div class="flex items-center justify-between">
            <div>
              <h3 class="font-semibold">집중 블록</h3>
              <p class="text-slate-500">08:00 - 12:00</p>
            </div>
            <span class="rounded-full bg-slate-900 px-3 py-2 text-white">켜짐</span>
          </div>
        </article>
        <article class="rounded-3xl border border-slate-200 p-4">
          <div class="flex items-center justify-between">
            <div>
              <h3 class="font-semibold">저녁 휴식</h3>
              <p class="text-slate-500">18:00 - 21:00</p>
            </div>
            <span class="rounded-full bg-slate-100 px-3 py-2 text-slate-700">끔</span>
          </div>
        </article>
      </div>
    </section>

    <section class="rounded-3xl bg-white p-6 shadow-sm">
      <h2 class="text-xl font-semibold">시간대 추가</h2>
      <div class="mt-6 space-y-4">
        <input class="w-full rounded-3xl border border-slate-200 bg-slate-50 p-4" placeholder="집중 블록" />
        <div class="grid gap-4 sm:grid-cols-2">
          <input type="time" class="rounded-3xl border border-slate-200 bg-slate-50 p-4" />
          <input type="time" class="rounded-3xl border border-slate-200 bg-slate-50 p-4" />
        </div>
        <button class="w-full rounded-3xl bg-slate-900 p-4 text-white">저장</button>
      </div>
    </section>
  </div>
</body>
</html>
