<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StudyFlow - 카테고리 알림</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900">
  <div class="min-h-screen bg-slate-50 p-6">
    <header class="mb-8 rounded-3xl bg-white p-6 shadow-lg">
      <h1 class="text-3xl font-bold">카테고리 알림</h1>
      <p class="mt-2 text-slate-500">카테고리별 푸시, 소리, 진동을 조절하세요.</p>
    </header>

    <section class="space-y-6">
      <article class="rounded-3xl bg-white p-6 shadow-sm">
        <div class="mb-4 flex items-center gap-4">
          <div class="flex h-12 w-12 items-center justify-center rounded-3xl bg-slate-100">📚</div>
          <div>
            <h2 class="text-xl font-semibold">공부</h2>
            <p class="text-slate-500">관련 알림을 개별로 설정합니다.</p>
          </div>
        </div>
        <div class="grid gap-3 sm:grid-cols-3">
          <button class="rounded-3xl bg-slate-900 px-4 py-3 text-white">푸시 켜기</button>
          <button class="rounded-3xl border border-slate-200 bg-slate-50 px-4 py-3">소리 끄기</button>
          <button class="rounded-3xl border border-slate-200 bg-slate-50 px-4 py-3">진동 끄기</button>
        </div>
      </article>

      <article class="rounded-3xl bg-white p-6 shadow-sm">
        <div class="mb-4 flex items-center gap-4">
          <div class="flex h-12 w-12 items-center justify-center rounded-3xl bg-slate-100">💤</div>
          <div>
            <h2 class="text-xl font-semibold">휴식</h2>
            <p class="text-slate-500">휴식 관련 알림을 켜거나 끌 수 있습니다.</p>
          </div>
        </div>
        <div class="grid gap-3 sm:grid-cols-3">
          <button class="rounded-3xl bg-slate-900 px-4 py-3 text-white">푸시 켜기</button>
          <button class="rounded-3xl border border-slate-200 bg-slate-50 px-4 py-3">소리 끄기</button>
          <button class="rounded-3xl border border-slate-200 bg-slate-50 px-4 py-3">진동 켜기</button>
        </div>
      </article>
    </section>
  </div>
</body>
</html>
