<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StudyFlow - 통계</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900">
  <div class="min-h-screen bg-slate-50 p-6">
    <header class="mb-8 rounded-3xl bg-white p-6 shadow-lg">
      <h1 class="text-3xl font-bold">통계</h1>
      <p class="mt-2 text-slate-500">학습 성과와 기록을 한눈에 확인하세요.</p>
    </header>

    <section class="grid gap-4 md:grid-cols-3 mb-8">
      <article class="rounded-3xl bg-slate-900 p-6 text-white shadow-sm">
        <p class="text-sm uppercase opacity-80">연속 기록</p>
        <p class="mt-4 text-3xl font-semibold">7일</p>
      </article>
      <article class="rounded-3xl bg-white p-6 shadow-sm">
        <p class="text-sm uppercase text-slate-500">전체 작업</p>
        <p class="mt-4 text-3xl font-semibold">24</p>
      </article>
      <article class="rounded-3xl bg-white p-6 shadow-sm">
        <p class="text-sm uppercase text-slate-500">완료율</p>
        <p class="mt-4 text-3xl font-semibold">75%</p>
      </article>
    </section>

    <section class="grid gap-6 xl:grid-cols-2 mb-8">
      <div class="rounded-3xl bg-white p-6 shadow-sm">
        <h2 class="text-xl font-semibold">주간 추세</h2>
        <div class="mt-6 grid gap-3">
          <div class="h-40 rounded-3xl bg-slate-100 p-4">그래프 자리</div>
        </div>
      </div>
      <div class="rounded-3xl bg-white p-6 shadow-sm">
        <h2 class="text-xl font-semibold">카테고리 분포</h2>
        <ul class="mt-6 space-y-4">
          <li class="rounded-3xl bg-slate-100 p-4">공부 45%</li>
          <li class="rounded-3xl bg-slate-100 p-4">운동 20%</li>
          <li class="rounded-3xl bg-slate-100 p-4">휴식 15%</li>
        </ul>
      </div>
    </section>

    <section class="rounded-3xl bg-white p-6 shadow-sm">
      <h2 class="text-xl font-semibold">AI 분석</h2>
      <p class="mt-4 text-slate-600">작업과 일정을 분석하여 이번 주 추천과 동기부여를 제공합니다.</p>
      <div class="mt-6 rounded-3xl bg-slate-100 p-6">
        <p class="text-base text-slate-700">오늘도 차근차근 진행해보세요. 꾸준함이 성과를 만듭니다.</p>
      </div>
    </section>
  </div>
</body>
</html>
