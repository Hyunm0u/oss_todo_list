<script>
    class CalendarManager {
        constructor() {
            this.currentDate = new Date();
            this.selectedDate = new Date(2024, 4, 10); // May 10, 2024
            this.viewYear = 2024;
            this.viewMonth = 4; // 0-indexed

            this.mockData = {
                '2024-04-10': [
                    { title: '알고리즘 스터디', time: '19:00 ~ 21:00', type: '학습', color: 'primary', icon: 'schedule' },
                    { title: '개인 운동', time: '08:00 ~ 09:30', type: '생활', color: 'tertiary', icon: 'fitness_center' }
                ],
                '2024-04-11': [
                    { title: '팀 프로젝트 회의', time: '14:00 ~ 16:00', type: '학습', color: 'primary', icon: 'groups' },
                    { title: '전공 서적 독서', time: '10:00 ~ 12:00', type: '학습', color: 'primary', icon: 'menu_book' }
                ],
                '2024-04-12': [
                    { title: '주간 회고', time: '20:00 ~ 21:00', type: '기타', color: 'secondary', icon: 'history_edu' }
                ],
                '2024-05-10': [
                    { title: '경제학 원론 세미나', time: '13:00 ~ 15:00', type: '학습', color: 'primary', icon: 'school' },
                    { title: '동아리 정기 모임', time: '18:00 ~ 20:00', type: '생활', color: 'secondary', icon: 'celebration' }
                ]
            };

            this.init();
        }

        init() {
            this.render();
            this.setupEventListeners();
        }

        setupEventListeners() {
            document.getElementById('prev-month').addEventListener('click', () => {
                this.changeMonth(-1);
                this.vibrate();
            });
            document.getElementById('next-month').addEventListener('click', () => {
                this.changeMonth(1);
                this.vibrate();
            });

            // Selector Modal Events
            const openBtn = document.getElementById('open-selector');
            const closeBtn = document.getElementById('close-selector');
            const cancelBtn = document.getElementById('modal-cancel');
            const modal = document.getElementById('selector-modal');
            const content = document.getElementById('modal-content');

            const toggleModal = (show) => {
                if (show) {
                    this.renderSelectorOptions();
                    modal.classList.remove('hidden');
                    setTimeout(() => {
                        modal.classList.remove('opacity-0');
                        content.classList.remove('scale-95');
                    }, 10);
                } else {
                    modal.classList.add('opacity-0');
                    content.classList.add('scale-95');
                    setTimeout(() => modal.classList.add('hidden'), 200);
                }
            };

            openBtn.addEventListener('click', () => toggleModal(true));
            closeBtn.addEventListener('click', () => toggleModal(false));
            cancelBtn.addEventListener('click', () => toggleModal(false));
            modal.addEventListener('click', (e) => { if(e.target === modal) toggleModal(false); });
        }

        vibrate() {
            if (window.navigator && window.navigator.vibrate) window.navigator.vibrate(5);
        }

        changeMonth(delta) {
            this.viewMonth += delta;
            if (this.viewMonth < 0) {
                this.viewMonth = 11;
                this.viewYear--;
            } else if (this.viewMonth > 11) {
                this.viewMonth = 0;
                this.viewYear++;
            }
            this.updateSelectionToFirstOfMonth();
            this.render();
        }

        updateSelectionToFirstOfMonth() {
            // Keep the selected date within the same month when navigating via arrows
            this.selectedDate = new Date(this.viewYear, this.viewMonth, 1);
        }

        formatDateKey(year, month, day) {
            return \`\${year}-\${month.toString().padStart(2, '0')}-\${day.toString().padStart(2, '0')}\`;
        }

        renderSelectorOptions() {
            const yearGrid = document.getElementById('year-grid');
            const monthGrid = document.getElementById('month-grid');
            
            // Render Years (2020-2030)
            let yearHtml = '';
            for(let y = 2020; y <= 2030; y++) {
                const isSelected = y === this.viewYear;
                yearHtml += \`
                    <button class="py-2 rounded-lg text-body-md transition-all \${isSelected ? 'bg-primary text-on-primary font-bold' : 'bg-surface-container-high text-on-surface-variant'}" 
                            onclick="window.calendarManager.selectYear(\${y})">
                        \${y}
                    </button>
                \`;
            }
            yearGrid.innerHTML = yearHtml;

            // Render Months (1-12)
            let monthHtml = '';
            for(let m = 0; m < 12; m++) {
                const isSelected = m === this.viewMonth;
                monthHtml += \`
                    <button class="py-2 rounded-lg text-body-md transition-all \${isSelected ? 'bg-primary text-on-primary font-bold' : 'bg-surface-container-high text-on-surface-variant'}" 
                            onclick="window.calendarManager.selectMonth(\${m})">
                        \${m + 1}월
                    </button>
                \`;
            }
            monthGrid.innerHTML = monthHtml;
        }

        selectYear(y) {
            this.viewYear = y;
            this.vibrate();
            this.renderSelectorOptions();
            this.syncAndRender();
        }

        selectMonth(m) {
            this.viewMonth = m;
            this.vibrate();
            this.renderSelectorOptions();
            this.syncAndRender();
        }

        syncAndRender() {
            this.updateSelectionToFirstOfMonth();
            this.render();
        }

        render() {
            this.renderMonthlyGrid();
            this.renderWeeklyPicker();
            this.renderSchedule();
        }

        renderMonthlyGrid() {
            const grid = document.getElementById('monthly-grid');
            const display = document.getElementById('current-month-display');
            display.textContent = \`\${this.viewYear}년 \${this.viewMonth + 1}월\`;

            const days = ['일', '월', '화', '수', '목', '금', '토'];
            const firstDay = new Date(this.viewYear, this.viewMonth, 1).getDay();
            const lastDate = new Date(this.viewYear, this.viewMonth + 1, 0).getDate();
            const prevMonthLastDate = new Date(this.viewYear, this.viewMonth, 0).getDate();

            let html = days.map((d, i) => {
                let colorClass = 'text-outline';
                if (i === 0) colorClass = 'text-error';
                if (i === 6) colorClass = 'text-primary';
                return \`<div class="text-label-sm font-label-sm \${colorClass}">\${d}</div>\`;
            }).join('');

            for (let i = firstDay - 1; i >= 0; i--) {
                html += \`<div class="py-1 text-body-md text-outline-variant opacity-40">\${prevMonthLastDate - i}</div>\`;
            }

            for (let d = 1; d <= lastDate; d++) {
                const isSelected = this.selectedDate.getFullYear() === this.viewYear && 
                                 this.selectedDate.getMonth() === this.viewMonth && 
                                 this.selectedDate.getDate() === d;
                
                const dayKey = this.formatDateKey(this.viewYear, this.viewMonth, d);
                const hasData = this.mockData[dayKey] && this.mockData[dayKey].length > 0;
                
                const dayOfWeek = new Date(this.viewYear, this.viewMonth, d).getDay();
                const isHoliday = (this.viewMonth === 4 && d === 5) || (this.viewMonth === 4 && d === 15);
                const isSaturday = (dayOfWeek === 6);
                const isSunday = (dayOfWeek === 0);

                let textColor = 'text-on-surface';
                if (isSunday || isHoliday) textColor = 'text-error';
                else if (isSaturday) textColor = 'text-primary';

                const cellClass = isSelected 
                    ? 'bg-primary text-on-primary rounded-full' 
                    : \`\${textColor} rounded-full hover:bg-surface-container-high\`;

                html += \`
                    <div class="date-cell py-1 text-body-md cursor-pointer transition-all relative \${cellClass}" data-date="\${dayKey}">
                        \${d}
                        \${hasData && !isSelected ? \`<div class="absolute bottom-0 left-1/2 -translate-x-1/2 flex gap-[2px]"><div class="w-1 h-1 bg-primary rounded-full"></div></div>\` : ''}
                        \${this.viewMonth === 4 && d === 15 ? \`<span class="text-[8px] absolute -bottom-3 left-1/2 -translate-x-1/2 whitespace-nowrap text-error opacity-70">석가탄신일</span>\` : ''}
                    </div>
                \`;
            }

            grid.innerHTML = html;

            grid.querySelectorAll('.date-cell').forEach(cell => {
                cell.addEventListener('click', () => {
                    const [y, m, d] = cell.dataset.date.split('-').map(Number);
                    this.selectedDate = new Date(y, m, d);
                    this.vibrate();
                    this.render();
                });
            });
        }

        renderWeeklyPicker() {
            const picker = document.getElementById('weekly-picker');
            picker.innerHTML = '';
            
            for (let i = -3; i <= 3; i++) {
                const d = new Date(this.selectedDate);
                d.setDate(this.selectedDate.getDate() + i);
                
                const isSelected = i === 0;
                const dayName = ['일', '월', '화', '수', '목', '금', '토'][d.getDay()];
                const dayNum = d.getDate();
                const dayKey = this.formatDateKey(d.getFullYear(), d.getMonth(), dayNum);
                const hasData = this.mockData[dayKey] && this.mockData[dayKey].length > 0;

                const btn = document.createElement('button');
                btn.className = isSelected 
                    ? "picker-btn flex flex-col items-center justify-center min-w-[56px] py-stack-md bg-primary text-on-primary rounded-xl shadow-lg transition-all scale-105 z-10"
                    : "picker-btn flex flex-col items-center justify-center min-w-[56px] py-stack-md bg-surface-container-lowest border border-outline-variant/30 rounded-xl hover:bg-surface-container-high transition-all";
                
                btn.innerHTML = \`
                    <span class="text-label-md font-label-md \${isSelected ? 'opacity-80' : 'text-on-surface-variant'}">\${dayName}</span>
                    <span class="text-title-md font-title-md \${isSelected ? 'text-on-primary' : 'text-on-surface'}">\${dayNum}</span>
                    \${hasData ? \`<div class="w-1 h-1 \${isSelected ? 'bg-on-primary' : 'bg-primary'} rounded-full mt-1"></div>\` : '<div class="h-2"></div>'}
                \`;

                btn.addEventListener('click', () => {
                    this.selectedDate = d;
                    this.viewYear = d.getFullYear();
                    this.viewMonth = d.getMonth();
                    this.vibrate();
                    this.render();
                });

                picker.appendChild(btn);
            }

            picker.scrollTo({ left: (picker.scrollWidth / 2) - (picker.offsetWidth / 2), behavior: 'smooth' });
        }

        renderSchedule() {
            const title = document.getElementById('schedule-title');
            const countBadge = document.getElementById('task-count');
            const list = document.getElementById('schedule-list');

            const month = this.selectedDate.getMonth() + 1;
            const day = this.selectedDate.getDate();
            const dateKey = this.formatDateKey(this.selectedDate.getFullYear(), this.selectedDate.getMonth(), day);
            const tasks = this.mockData[dateKey] || [];

            title.textContent = \`\${month}월 \${day}일의 일정\`;
            countBadge.textContent = \`\${tasks.length}개 남음\`;
            countBadge.style.display = tasks.length > 0 ? 'block' : 'none';

            list.style.opacity = '0';
            
            setTimeout(() => {
                if (tasks.length === 0) {
                    list.innerHTML = \`
                        <div class="py-12 flex flex-col items-center justify-center text-on-surface-variant opacity-60">
                            <span class="material-symbols-outlined text-[48px] mb-2">event_busy</span>
                            <p class="text-body-md">일정이 없습니다.</p>
                        </div>
                    \`;
                } else {
                    list.innerHTML = tasks.map(task => \`
                        <div class="bg-surface-container-lowest rounded-xl p-stack-md border border-outline-variant/30 flex gap-stack-md items-start relative overflow-hidden group hover:shadow-md transition-shadow">
                            <div class="absolute left-0 top-0 bottom-0 w-1 bg-\${task.color}"></div>
                            <div class="flex flex-col flex-1">
                                <div class="flex items-center justify-between mb-1">
                                    <span class="text-label-sm font-label-sm bg-\${task.color}-fixed text-on-\${task.color}-fixed-variant px-2 py-0.5 rounded-pill">\${task.type}</span>
                                    <button class="p-1 hover:bg-surface-container-high rounded-full">
                                        <span class="material-symbols-outlined text-[20px] text-on-surface-variant">more_vert</span>
                                    </button>
                                </div>
                                <h3 class="text-body-lg font-title-md text-on-surface">\${task.title}</h3>
                                <p class="text-body-md text-on-surface-variant mt-1 flex items-center gap-1">
                                    <span class="material-symbols-outlined text-[16px]">\${task.icon}</span> \${task.time}
                                </p>
                            </div>
                        </div>
                    \`).join('');
                }
                list.style.opacity = '1';
            }, 100);
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        window.calendarManager = new CalendarManager();
    });
<\/script>

<script>
    const state = {
        mode: 'create',
        currentId: null,
        selectedIcon: '',
        selectedColor: '',
        startTime: { h: 9, m: 0 },
        endTime: { h: 10, m: 0 },
        selectedDate: new Date(),
        tempSelectedDate: new Date(),
        viewDate: new Date(),
        activePickerMode: null,
        categories: [
            { id: 1, name: '운동', icon: 'fitness_center', color: '#0050cb' },
            { id: 2, name: '공부', icon: 'menu_book', color: '#fe9400' },
            { id: 3, name: '동아리', icon: 'groups', color: '#b60009' },
            { id: 5, name: '기타', icon: 'more_horiz', color: '#727687' }
        ]
    };

    // Generic backdrop click handler
    function handleBackdropClick(e, overlayId, closeFn) {
        if (e.target.id === overlayId) {
            closeFn();
        }
    }

    // --- Calendar Logic ---
    function renderCalendar() {
        const grid = document.getElementById('calendarGrid');
        const monthYearText = document.getElementById('currentMonthYear');
        const year = state.viewDate.getFullYear();
        const month = state.viewDate.getMonth();
        monthYearText.textContent = \`\${year}년 \${month + 1}월\`;
        const firstDay = new Date(year, month, 1).getDay();
        const lastDate = new Date(year, month + 1, 0).getDate();
        grid.innerHTML = '';
        for (let i = 0; i < firstDay; i++) {
            const empty = document.createElement('div');
            empty.className = 'calendar-day empty';
            grid.appendChild(empty);
        }
        const today = new Date();
        today.setHours(0,0,0,0);
        for (let day = 1; day <= lastDate; day++) {
            const dayEl = document.createElement('div');
            dayEl.className = 'calendar-day';
            dayEl.textContent = day;
            const curDate = new Date(year, month, day);
            if (curDate.getTime() === today.getTime()) dayEl.classList.add('today');
            if (curDate.getFullYear() === state.tempSelectedDate.getFullYear() &&
                curDate.getMonth() === state.tempSelectedDate.getMonth() &&
                curDate.getDate() === state.tempSelectedDate.getDate()) {
                dayEl.classList.add('selected');
            }
            dayEl.onclick = () => {
                state.tempSelectedDate = new Date(year, month, day);
                renderCalendar();
            };
            grid.appendChild(dayEl);
        }
    }

    function changeMonth(delta) {
        state.viewDate.setMonth(state.viewDate.getMonth() + delta);
        renderCalendar();
    }

    function openCalendarModal() {
        state.tempSelectedDate = new Date(state.selectedDate);
        state.viewDate = new Date(state.selectedDate);
        const overlay = document.getElementById('calendarModalOverlay');
        overlay.classList.remove('hidden');
        renderCalendar();
        setTimeout(() => overlay.classList.add('opacity-100'), 10);
    }

    function closeCalendarModal() {
        const overlay = document.getElementById('calendarModalOverlay');
        overlay.classList.remove('opacity-100');
        setTimeout(() => overlay.classList.add('hidden'), 300);
    }

    function confirmDate() {
        state.selectedDate = new Date(state.tempSelectedDate);
        updateDateDisplay();
        closeCalendarModal();
    }

    function updateDateDisplay() {
        const y = state.selectedDate.getFullYear();
        const m = state.selectedDate.getMonth() + 1;
        const d = state.selectedDate.getDate();
        document.getElementById('selectedDateText').textContent = \`\${y}년 \${m}월 \${d}일\`;
        updateDDay();
    }

    function updateDDay() {
        const now = new Date();
        now.setHours(0,0,0,0);
        const target = new Date(state.selectedDate);
        target.setHours(0,0,0,0);
        const diffTime = target - now;
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        const display = document.getElementById('dDayDisplay');
        if (diffDays === 0) display.textContent = 'D-Day';
        else if (diffDays > 0) display.textContent = \`D-\${diffDays}\`;
        else display.textContent = \`D+\${Math.abs(diffDays)}\`;
    }

    // --- Time Picker Logic ---
    const hourWheel = document.getElementById('hourWheel');
    const minuteWheel = document.getElementById('minuteWheel');
    const timePickerOverlay = document.getElementById('timePickerOverlay');
    const timePickerSheet = document.getElementById('timePickerSheet');

    function initTimeWheels() {
        let hourHtml = '<div class="h-20"></div>';
        for(let i=0; i<24; i++) {
            const val = i.toString().padStart(2, '0');
            hourHtml += \`<div class="time-item" data-value="\${i}">\${val}</div>\`;
        }
        hourHtml += '<div class="h-20"></div>';
        hourWheel.innerHTML = hourHtml;
        let minuteHtml = '<div class="h-20"></div>';
        for(let i=0; i<60; i += 5) {
            const val = i.toString().padStart(2, '0');
            minuteHtml += \`<div class="time-item" data-value="\${i}">\${val}</div>\`;
        }
        minuteHtml += '<div class="h-20"></div>';
        minuteWheel.innerHTML = minuteHtml;
    }

    function openTimePicker(mode) {
        state.activePickerMode = mode;
        document.getElementById('pickerTitle').textContent = mode === 'start' ? '시작 시간 설정' : '종료 시간 설정';
        timePickerOverlay.classList.remove('hidden');
        setTimeout(() => {
            timePickerOverlay.classList.add('opacity-100');
            timePickerSheet.classList.add('open');
        }, 10);
        const initialTime = mode === 'start' ? state.startTime : state.endTime;
        scrollToValue('hour', initialTime.h);
        scrollToValue('minute', initialTime.m);
        updateWheelVisuals();
    }

    function closeTimePicker() {
        timePickerSheet.classList.remove('open');
        timePickerOverlay.classList.remove('opacity-100');
        setTimeout(() => timePickerOverlay.classList.add('hidden'), 400);
    }

    function scrollToValue(wheelType, value) {
        const wheel = wheelType === 'hour' ? hourWheel : minuteWheel;
        const items = wheel.querySelectorAll('.time-item');
        let target = 0;
        items.forEach((item, index) => {
            if(parseInt(item.dataset.value) === value) target = index;
        });
        wheel.scrollTop = target * 40;
    }

    function handleWheelScroll(wheelType) {
        updateWheelVisuals();
    }

    function updateWheelVisuals() {
        [hourWheel, minuteWheel].forEach(wheel => {
            const scrollTop = wheel.scrollTop;
            const activeIndex = Math.round(scrollTop / 40);
            const items = wheel.querySelectorAll('.time-item');
            items.forEach((item, index) => {
                item.classList.remove('active', 'blur');
                const diff = Math.abs(index - activeIndex);
                if (diff === 0) item.classList.add('active');
                else if (diff === 1) item.classList.add('blur');
            });
        });
    }

    function confirmTime() {
        const hItems = hourWheel.querySelectorAll('.time-item');
        const hIndex = Math.round(hourWheel.scrollTop / 40);
        const h = parseInt(hItems[hIndex]?.dataset.value || 0);
        const mItems = minuteWheel.querySelectorAll('.time-item');
        const mIndex = Math.round(minuteWheel.scrollTop / 40);
        const m = parseInt(mItems[mIndex]?.dataset.value || 0);
        if (state.activePickerMode === 'start') {
            state.startTime = { h, m };
            document.getElementById('startTimeText').textContent = \`\${h.toString().padStart(2, '0')}:\${m.toString().padStart(2, '0')}\`;
        } else {
            state.endTime = { h, m };
            document.getElementById('endTimeText').textContent = \`\${h.toString().padStart(2, '0')}:\${m.toString().padStart(2, '0')}\`;
        }
        validateTimes();
        closeTimePicker();
    }

    function setQuickTime(h, m) {
        scrollToValue('hour', h);
        scrollToValue('minute', m);
        updateWheelVisuals();
    }

    function validateTimes() {
        const startTotal = state.startTime.h * 60 + state.startTime.m;

<script>
        // State Management
        let currentEditingCard = null;
        let targetElementToDelete = null;
        let pickerTarget = 'start'; // 'start' or 'end'
        let selectedDays = [0, 1, 2, 3, 4]; // Initial default for add

        // Accordion functionality
        function toggleAccordion(card) {
            if (event.target.closest('button') || event.target.closest('label')) return;
            
            const content = card.querySelector('.expansion-content');
            const isExpanded = card.classList.contains('time-card-selected');

            document.querySelectorAll('.time-card').forEach(otherCard => {
                if (otherCard !== card) {
                    otherCard.classList.remove('time-card-selected');
                    otherCard.querySelector('.expansion-content').style.maxHeight = '0px';
                }
            });

            if (!isExpanded) {
                card.classList.add('time-card-selected');
                content.style.maxHeight = content.scrollHeight + 'px';
            } else {
                card.classList.remove('time-card-selected');
                content.style.maxHeight = '0px';
            }
        }

        // Edit Entry Point
        function handleEditClick(e) {
            e.stopPropagation();
            const card = e.target.closest('.time-card');
            currentEditingCard = card;
            
            const name = card.querySelector('.card-name').textContent;
            const timeRange = card.querySelector('.card-time').textContent;
            const times = timeRange.split(' ~ ');
            
            const daysChips = card.querySelectorAll('.day-chip');
            selectedDays = [];
            daysChips.forEach(chip => {
                if (chip.classList.contains('bg-primary')) {
                    selectedDays.push(parseInt(chip.dataset.day));
                }
            });

            openBottomSheet('edit', { name, startTime: times[0], endTime: times[1], days: selectedDays });
        }

        // Bottom Sheet Logic
        const bottomSheetOverlay = document.getElementById('bottom-sheet-overlay');
        const bottomSheet = document.getElementById('bottom-sheet');
        const sheetTitle = document.getElementById('sheet-title');
        const primaryBtn = document.getElementById('primary-action-btn');
        const sheetDeleteBtn = document.getElementById('sheet-delete-btn');
        const blockNameInput = document.getElementById('block-name');
        const startTimeDisplay = document.getElementById('start-time-display');
        const endTimeDisplay = document.getElementById('end-time-display');

        function openBottomSheet(mode = 'add', data = null) {
            if (mode === 'edit') {
                sheetTitle.innerText = '시간대 수정';
                primaryBtn.innerText = '수정 완료';

                const day = parseInt(btn.dataset.day);
                if (selectedDays.includes(day)) {
                    selectedDays = selectedDays.filter(d => d !== day);
                } else {
                    selectedDays.push(day);

        function updateSheetDayButtons() {

            const [h, m] = currentVal.split(':');
            
            initWheel('hour-wheel', 24, h);
            initWheel('minute-wheel', 60, m);

            const timeStr = \`\${h}:\${m}\`;
            
            if (pickerTarget === 'start') startTimeDisplay.innerText = timeStr;
            else endTimeDisplay.innerText = timeStr;
            
            closeTimePicker();

        function initWheel(id, count, initialVal) {
            const container = document.getElementById(id);
            container.innerHTML = '';
            // Padding items for scroll alignment
            for (let i = 0; i < 2; i++) container.appendChild(createItem(''));
            
            for (let i = 0; i < count; i++) {
                const val = i.toString().padStart(2, '0');
                const item = createItem(val);
                item.dataset.val = i;
                if (i === parseInt(initialVal)) item.classList.add('selected');
                container.appendChild(item);
            }
            
            for (let i = 0; i < 2; i++) container.appendChild(createItem(''));
            
            container.onscroll = () => {
                const items = container.querySelectorAll('.wheel-item[data-val]');
                let closest = null;
                let minDist = Infinity;
                const containerCenter = container.getBoundingClientRect().top + container.clientHeight / 2;
                
                items.forEach(item => {
                    const rect = item.getBoundingClientRect();
                    const itemCenter = rect.top + rect.height / 2;
                    const dist = Math.abs(containerCenter - itemCenter);
                    if (dist < minDist) {
                        minDist = dist;
                        closest = item;
                    }
                    item.classList.remove('selected');
                });
                
                if (closest) closest.classList.add('selected');
            };

            // Initial Scroll to value
            setTimeout(() => {
                const targetItem = container.querySelector(\`[data-val="\${parseInt(initialVal)}"]\`);
                if (targetItem) {
                    container.scrollTop = targetItem.offsetTop - container.clientHeight / 2 + targetItem.clientHeight / 2;
                }
            }, 50);
        }

<script>
    let currentTarget = 'start'; // 'start' or 'end'
    let startTime = "09:00";
    let endTime = "10:30";
    let activeDays = [];

    // Initialize wheels
    const hourWheel = document.getElementById('hour-wheel');
    const minuteWheel = document.getElementById('minute-wheel');

    function populateWheels() {
        hourWheel.innerHTML = '';
        minuteWheel.innerHTML = '';
        
        for (let i = 0; i < 24; i++) {
            const h = i.toString().padStart(2, '0');
            const div = document.createElement('div');
            div.className = 'picker-item snap-center';
            div.innerText = h;
            div.setAttribute('data-val', h);
            hourWheel.appendChild(div);
        }

        for (let i = 0; i < 60; i += 5) {
            const m = i.toString().padStart(2, '0');
            const div = document.createElement('div');
            div.className = 'picker-item snap-center';
            div.innerText = m;
            div.setAttribute('data-val', m);
            minuteWheel.appendChild(div);
        }
        
        // Add listeners for visual feedback
        [hourWheel, minuteWheel].forEach(wheel => {
            wheel.addEventListener('scroll', () => {
                const items = wheel.querySelectorAll('.picker-item');
                const wheelRect = wheel.getBoundingClientRect();
                const center = wheelRect.top + wheelRect.height / 2;
                
                items.forEach(item => {
                    const itemRect = item.getBoundingClientRect();
                    const itemCenter = itemRect.top + itemRect.height / 2;
                    if (Math.abs(center - itemCenter) < 22) {
                        item.classList.add('selected');
                    } else {
                        item.classList.remove('selected');
                    }
                });
            });
        });
    }

    function openTimePicker(type) {
        currentTarget = type;
        document.getElementById('picker-title').innerText = type === 'start' ? '시작 시간 설정' : '종료 시간 설정';
        const modal = document.getElementById('time-picker-modal');
        modal.classList.remove('hidden');
        
        const currentVal = type === 'start' ? startTime : endTime;
        const [h, m] = currentVal.split(':');
        
        // Scroll to current
        setTimeout(() => {
            const hItem = hourWheel.querySelector(\`[data-val="\${h}"]\`);
            const mVal = (Math.round(parseInt(m) / 5) * 5).toString().padStart(2, '0');
            const mItem = minuteWheel.querySelector(\`[data-val="\${mVal === '60' ? '00' : mVal}"]\`);
            
            if (hItem) hItem.scrollIntoView({ block: 'center' });
            if (mItem) mItem.scrollIntoView({ block: 'center' });
        }, 100);
    }

    function closeTimePicker() {
        document.getElementById('time-picker-modal').classList.add('hidden');
    }

    function confirmTime() {
        const selectedHour = hourWheel.querySelector('.selected')?.getAttribute('data-val') || '00';
        const selectedMinute = minuteWheel.querySelector('.selected')?.getAttribute('data-val') || '00';
        const timeStr = \`\${selectedHour}:\${selectedMinute}\`;
        
        if (currentTarget === 'start') {
            startTime = timeStr;
            document.getElementById('start-time-display').innerText = timeStr;
        } else {
            endTime = timeStr;
            document.getElementById('end-time-display').innerText = timeStr;
        }
        
        validateTimes();
        updatePreview();
        closeTimePicker();
    }

    function quickSelect(time) {
        const [h, m] = time.split(':');
        const hItem = hourWheel.querySelector(\`[data-val="\${h}"]\`);
        const mItem = minuteWheel.querySelector(\`[data-val="\${m}"]\`);
        if (hItem) hItem.scrollIntoView({ behavior: 'smooth', block: 'center' });
        if (mItem) mItem.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function validateTimes() {
        const start = parseInt(startTime.replace(':', ''));
        const end = parseInt(endTime.replace(':', ''));
        const warning = document.getElementById('time-warning');
        
        if (end < start) {
            warning.classList.remove('hidden');
            document.getElementById('end-time-trigger').classList.add('border-error');
        } else {
            warning.classList.add('hidden');
            document.getElementById('end-time-trigger').classList.remove('border-error');
        }
    }

    function toggleDay(btn, day) {
        const isSelected = btn.classList.contains('bg-primary-container');
        if (isSelected) {
            btn.classList.remove('bg-primary-container', 'text-on-primary-container', 'border-primary');
            activeDays = activeDays.filter(d => d !== day);
        } else {
            btn.classList.add('bg-primary-container', 'text-on-primary-container', 'border-primary');
            activeDays.push(day);
        }
        updatePreview();
    }

    function updateColor(colorHex, btn) {
        document.getElementById('preview-accent').style.backgroundColor = colorHex;
        document.getElementById('preview-border').style.backgroundColor = colorHex;
        document.querySelectorAll('.color-swatch').forEach(swatch => swatch.classList.remove('selected-color-ring'));
        btn.classList.add('selected-color-ring');
    }

    function updatePreview() {
        const nameInput = document.getElementById('schedule-name-input');
        const previewTitle = document.getElementById('preview-title');
        const previewSub = document.getElementById('preview-time-days');
        
        previewTitle.innerText = nameInput.value || '일정 이름';
        const dayString = activeDays.length > 0 ? activeDays.join(', ') : '';
        previewSub.innerText = \`\${startTime} - \${endTime}\${dayString ? ' | ' + dayString : ''}\`;
    }

    // Event Listeners
    document.getElementById('start-time-trigger').addEventListener('click', () => openTimePicker('start'));
    document.getElementById('end-time-trigger').addEventListener('click', () => openTimePicker('end'));
    document.getElementById('schedule-name-input').addEventListener('input', updatePreview);

    // Initial Load
    populateWheels();
    // Set some default days for visual consistency with previous screenshot
    const dayBtns = document.querySelectorAll('.day-btn');
    const initialDays = ['월', '수', '금'];
    dayBtns.forEach(btn => {
        if (initialDays.includes(btn.innerText)) {
            toggleDay(btn, btn.innerText);
        }
    });
    updatePreview();
<\/script>

const MAIN = ["dashboard","calendar","stats","settings"];
const TABS = {
  dashboard:{icon:"home",label:"Home"},
  calendar:{icon:"calendar_today",label:"Calendar"},
  stats:{icon:"analytics",label:"Stats"},
  settings:{icon:"settings",label:"Settings"}
};
const frames = {};
const stage = document.getElementById("stage");
const navbar = document.getElementById("navbar");
const fab = document.getElementById("fab");
let current = null;
let stack = [];

function getFrame(key){
  if(frames[key]) return frames[key];
  const f = document.createElement("iframe");
  f.className = "screen-frame";
  f.setAttribute("title", key);
  f.srcdoc = SCREENS[key];
  stage.appendChild(f);
  frames[key] = f;
  return f;
}

function show(key){
  const f = getFrame(key);
  Object.keys(frames).forEach(k => { frames[k].style.display = (k===key)?"block":"none"; });
  f.style.display = "block";
}

function setActive(key){
  navbar.querySelectorAll(".navbtn").forEach(btn => {
    const isActive = btn.dataset.tab === key;
    btn.className = "navbtn flex flex-1 flex-col items-center justify-center rounded-xl mx-1 py-stack-sm transition-all duration-200 active:scale-90 " +
      (isActive ? "bg-primary-container text-on-primary-container" : "text-on-surface-variant hover:bg-surface-container-high");
    const icon = btn.querySelector(".material-symbols-outlined");
    icon.style.fontVariationSettings = isActive ? "'FILL' 1" : "'FILL' 0";
  });
}

function navigate(key, isBack){
  if(!SCREENS[key]) return;
  if(!isBack){
    if(MAIN.includes(key)) stack = [];
    else if(current) stack.push(current);
  }
  current = key;
  show(key);
  const onMain = MAIN.includes(key);
  navbar.style.display = onMain ? "flex" : "none";
  fab.style.display = onMain ? "flex" : "none";
  if(onMain) setActive(key);
}

function goBack(){
  const prev = stack.pop() || "dashboard";
  navigate(prev, true);
}

window.addEventListener("message", e => {
  const d = e.data || {};
  if(d.type === "go") navigate(d.screen);
  else if(d.type === "back") goBack();
});

navbar.querySelectorAll(".navbtn").forEach(btn => {
  btn.addEventListener("click", () => navigate(btn.dataset.tab));
});
fab.addEventListener("click", () => navigate("add"));

navigate("dashboard");

</script>
