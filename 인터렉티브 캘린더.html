<script>
    class CalendarManager {
        constructor() {
            this.currentDate = new Date();
            this.selectedDate = new Date(2024, 4, 10); // May 10, 2024
            this.viewYear = 2024;
            this.viewMonth = 4; // 0-indexed

            this.mockData = {
                '2024-04-10': [
                    { title: '알고리즘 스터디', time: '19:00 ~ 21:00', type: '학습', color: 'primary', icon: 'schedule' },
                    { title: '개인 운동', time: '08:00 ~ 09:30', type: '생활', color: 'tertiary', icon: 'fitness_center' }
                ],
                '2024-04-11': [
                    { title: '팀 프로젝트 회의', time: '14:00 ~ 16:00', type: '학습', color: 'primary', icon: 'groups' },
                    { title: '전공 서적 독서', time: '10:00 ~ 12:00', type: '학습', color: 'primary', icon: 'menu_book' }
                ],
                '2024-04-12': [
                    { title: '주간 회고', time: '20:00 ~ 21:00', type: '기타', color: 'secondary', icon: 'history_edu' }
                ],
                '2024-05-10': [
                    { title: '경제학 원론 세미나', time: '13:00 ~ 15:00', type: '학습', color: 'primary', icon: 'school' },
                    { title: '동아리 정기 모임', time: '18:00 ~ 20:00', type: '생활', color: 'secondary', icon: 'celebration' }
                ]
            };

            this.init();
        }

        init() {
            this.render();
            this.setupEventListeners();
        }

        setupEventListeners() {
            document.getElementById('prev-month').addEventListener('click', () => {
                this.changeMonth(-1);
                this.vibrate();
            });
            document.getElementById('next-month').addEventListener('click', () => {
                this.changeMonth(1);
                this.vibrate();
            });

            // Selector Modal Events
            const openBtn = document.getElementById('open-selector');
            const closeBtn = document.getElementById('close-selector');
            const cancelBtn = document.getElementById('modal-cancel');
            const modal = document.getElementById('selector-modal');
            const content = document.getElementById('modal-content');

            const toggleModal = (show) => {
                if (show) {
                    this.renderSelectorOptions();
                    modal.classList.remove('hidden');
                    setTimeout(() => {
                        modal.classList.remove('opacity-0');
                        content.classList.remove('scale-95');
                    }, 10);
                } else {
                    modal.classList.add('opacity-0');
                    content.classList.add('scale-95');
                    setTimeout(() => modal.classList.add('hidden'), 200);
                }
            };

            openBtn.addEventListener('click', () => toggleModal(true));
            closeBtn.addEventListener('click', () => toggleModal(false));
            cancelBtn.addEventListener('click', () => toggleModal(false));
            modal.addEventListener('click', (e) => { if(e.target === modal) toggleModal(false); });
        }

        vibrate() {
            if (window.navigator && window.navigator.vibrate) window.navigator.vibrate(5);
        }

        changeMonth(delta) {
            this.viewMonth += delta;
            if (this.viewMonth < 0) {
                this.viewMonth = 11;
                this.viewYear--;
            } else if (this.viewMonth > 11) {
                this.viewMonth = 0;
                this.viewYear++;
            }
            this.updateSelectionToFirstOfMonth();
            this.render();
        }

        updateSelectionToFirstOfMonth() {
            // Keep the selected date within the same month when navigating via arrows
            this.selectedDate = new Date(this.viewYear, this.viewMonth, 1);
        }

        formatDateKey(year, month, day) {
            return `${year}-${month.toString().padStart(2, '0')}-${day.toString().padStart(2, '0')}`;
        }

        renderSelectorOptions() {
            const yearGrid = document.getElementById('year-grid');
            const monthGrid = document.getElementById('month-grid');
            
            // Render Years (2020-2030)
            let yearHtml = '';
            for(let y = 2020; y <= 2030; y++) {
                const isSelected = y === this.viewYear;
                yearHtml += `
                    <button class="py-2 rounded-lg text-body-md transition-all ${isSelected ? 'bg-primary text-on-primary font-bold' : 'bg-surface-container-high text-on-surface-variant'}" 
                            onclick="window.calendarManager.selectYear(${y})">
                        ${y}
                    </button>
                `;
            }
            yearGrid.innerHTML = yearHtml;

            // Render Months (1-12)
            let monthHtml = '';
            for(let m = 0; m < 12; m++) {
                const isSelected = m === this.viewMonth;
                monthHtml += `
                    <button class="py-2 rounded-lg text-body-md transition-all ${isSelected ? 'bg-primary text-on-primary font-bold' : 'bg-surface-container-high text-on-surface-variant'}" 
                            onclick="window.calendarManager.selectMonth(${m})">
                        ${m + 1}월
                    </button>
                `;
            }
            monthGrid.innerHTML = monthHtml;
        }

        selectYear(y) {
            this.viewYear = y;
            this.vibrate();
            this.renderSelectorOptions();
            this.syncAndRender();
        }

        selectMonth(m) {
            this.viewMonth = m;
            this.vibrate();
            this.renderSelectorOptions();
            this.syncAndRender();
        }

        syncAndRender() {
            this.updateSelectionToFirstOfMonth();
            this.render();
        }

        render() {
            this.renderMonthlyGrid();
            this.renderWeeklyPicker();
            this.renderSchedule();
        }

        renderMonthlyGrid() {
            const grid = document.getElementById('monthly-grid');
            const display = document.getElementById('current-month-display');
            display.textContent = `${this.viewYear}년 ${this.viewMonth + 1}월`;

            const days = ['일', '월', '화', '수', '목', '금', '토'];
            const firstDay = new Date(this.viewYear, this.viewMonth, 1).getDay();
            const lastDate = new Date(this.viewYear, this.viewMonth + 1, 0).getDate();
            const prevMonthLastDate = new Date(this.viewYear, this.viewMonth, 0).getDate();

            let html = days.map((d, i) => {
                let colorClass = 'text-outline';
                if (i === 0) colorClass = 'text-error';
                if (i === 6) colorClass = 'text-primary';
                return `<div class="text-label-sm font-label-sm ${colorClass}">${d}</div>`;
            }).join('');

            for (let i = firstDay - 1; i >= 0; i--) {
                html += `<div class="py-1 text-body-md text-outline-variant opacity-40">${prevMonthLastDate - i}</div>`;
            }

            for (let d = 1; d <= lastDate; d++) {
                const isSelected = this.selectedDate.getFullYear() === this.viewYear && 
                                 this.selectedDate.getMonth() === this.viewMonth && 
                                 this.selectedDate.getDate() === d;
                
                const dayKey = this.formatDateKey(this.viewYear, this.viewMonth, d);
                const hasData = this.mockData[dayKey] && this.mockData[dayKey].length > 0;
                
                const dayOfWeek = new Date(this.viewYear, this.viewMonth, d).getDay();
                const isHoliday = (this.viewMonth === 4 && d === 5) || (this.viewMonth === 4 && d === 15);
                const isSaturday = (dayOfWeek === 6);
                const isSunday = (dayOfWeek === 0);

                let textColor = 'text-on-surface';
                if (isSunday || isHoliday) textColor = 'text-error';
                else if (isSaturday) textColor = 'text-primary';

                const cellClass = isSelected 
                    ? 'bg-primary text-on-primary rounded-full' 
                    : `${textColor} rounded-full hover:bg-surface-container-high`;

                html += `
                    <div class="date-cell py-1 text-body-md cursor-pointer transition-all relative ${cellClass}" data-date="${dayKey}">
                        ${d}
                        ${hasData && !isSelected ? `<div class="absolute bottom-0 left-1/2 -translate-x-1/2 flex gap-[2px]"><div class="w-1 h-1 bg-primary rounded-full"></div></div>` : ''}
                        ${this.viewMonth === 4 && d === 15 ? `<span class="text-[8px] absolute -bottom-3 left-1/2 -translate-x-1/2 whitespace-nowrap text-error opacity-70">석가탄신일</span>` : ''}
                    </div>
                `;
            }

            grid.innerHTML = html;

            grid.querySelectorAll('.date-cell').forEach(cell => {
                cell.addEventListener('click', () => {
                    const [y, m, d] = cell.dataset.date.split('-').map(Number);
                    this.selectedDate = new Date(y, m, d);
                    this.vibrate();
                    this.render();
                });
            });
        }

        renderWeeklyPicker() {
            const picker = document.getElementById('weekly-picker');
            picker.innerHTML = '';
            
            for (let i = -3; i <= 3; i++) {
                const d = new Date(this.selectedDate);
                d.setDate(this.selectedDate.getDate() + i);
                
                const isSelected = i === 0;
                const dayName = ['일', '월', '화', '수', '목', '금', '토'][d.getDay()];
                const dayNum = d.getDate();
                const dayKey = this.formatDateKey(d.getFullYear(), d.getMonth(), dayNum);
                const hasData = this.mockData[dayKey] && this.mockData[dayKey].length > 0;

                const btn = document.createElement('button');
                btn.className = isSelected 
                    ? "picker-btn flex flex-col items-center justify-center min-w-[56px] py-stack-md bg-primary text-on-primary rounded-xl shadow-lg transition-all scale-105 z-10"
                    : "picker-btn flex flex-col items-center justify-center min-w-[56px] py-stack-md bg-surface-container-lowest border border-outline-variant/30 rounded-xl hover:bg-surface-container-high transition-all";
                
                btn.innerHTML = `
                    <span class="text-label-md font-label-md ${isSelected ? 'opacity-80' : 'text-on-surface-variant'}">${dayName}</span>
                    <span class="text-title-md font-title-md ${isSelected ? 'text-on-primary' : 'text-on-surface'}">${dayNum}</span>
                    ${hasData ? `<div class="w-1 h-1 ${isSelected ? 'bg-on-primary' : 'bg-primary'} rounded-full mt-1"></div>` : '<div class="h-2"></div>'}
                `;

                btn.addEventListener('click', () => {
                    this.selectedDate = d;
                    this.viewYear = d.getFullYear();
                    this.viewMonth = d.getMonth();
                    this.vibrate();
                    this.render();
                });

                picker.appendChild(btn);
            }

            picker.scrollTo({ left: (picker.scrollWidth / 2) - (picker.offsetWidth / 2), behavior: 'smooth' });
        }

        renderSchedule() {
            const title = document.getElementById('schedule-title');
            const countBadge = document.getElementById('task-count');
            const list = document.getElementById('schedule-list');

            const month = this.selectedDate.getMonth() + 1;
            const day = this.selectedDate.getDate();
            const dateKey = this.formatDateKey(this.selectedDate.getFullYear(), this.selectedDate.getMonth(), day);
            const tasks = this.mockData[dateKey] || [];

            title.textContent = `${month}월 ${day}일의 일정`;
            countBadge.textContent = `${tasks.length}개 남음`;
            countBadge.style.display = tasks.length > 0 ? 'block' : 'none';

            list.style.opacity = '0';
            
            setTimeout(() => {
                if (tasks.length === 0) {
                    list.innerHTML = `
                        <div class="py-12 flex flex-col items-center justify-center text-on-surface-variant opacity-60">
                            <span class="material-symbols-outlined text-[48px] mb-2">event_busy</span>
                            <p class="text-body-md">일정이 없습니다.</p>
                        </div>
                    `;
                } else {
                    list.innerHTML = tasks.map(task => `
                        <div class="bg-surface-container-lowest rounded-xl p-stack-md border border-outline-variant/30 flex gap-stack-md items-start relative overflow-hidden group hover:shadow-md transition-shadow">
                            <div class="absolute left-0 top-0 bottom-0 w-1 bg-${task.color}"></div>
                            <div class="flex flex-col flex-1">
                                <div class="flex items-center justify-between mb-1">
                                    <span class="text-label-sm font-label-sm bg-${task.color}-fixed text-on-${task.color}-fixed-variant px-2 py-0.5 rounded-pill">${task.type}</span>
                                    <button class="p-1 hover:bg-surface-container-high rounded-full">
                                        <span class="material-symbols-outlined text-[20px] text-on-surface-variant">more_vert</span>
                                    </button>
                                </div>
                                <h3 class="text-body-lg font-title-md text-on-surface">${task.title}</h3>
                                <p class="text-body-md text-on-surface-variant mt-1 flex items-center gap-1">
                                    <span class="material-symbols-outlined text-[16px]">${task.icon}</span> ${task.time}
                                </p>
                            </div>
                        </div>
                    `).join('');
                }
                list.style.opacity = '1';
            }, 100);
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        window.calendarManager = new CalendarManager();
    });
</script>
</body></html>
