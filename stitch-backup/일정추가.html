<style>
        body {
            font-family: 'Hanken Grotesk', sans-serif;
            background-color: #f8f9fa;
            -webkit-tap-highlight-color: transparent;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .category-chip {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .category-chip.active {
            transform: scale(1.05);
            z-index: 10;
        }
        .edit-trigger {
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
        }
        .active .edit-trigger {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }
        .icon-choice.selected {
            outline: 2px solid #0050cb;
            background-color: rgba(0, 80, 203, 0.1);
            color: #0050cb;
        }
        .color-choice.selected { 
            outline: 3px solid #0050cb; 
            outline-offset: 2px;
            box-shadow: 0 0 10px rgba(0, 80, 203, 0.3);
        }
        .bottom-sheet {
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .bottom-sheet.open {
            transform: translateY(0);
        }
        .modal-animate-in {
            animation: modalFadeIn 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        @keyframes modalFadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .time-wheel {
            height: 200px;
            overflow-y: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
            scroll-snap-type: y mandatory;
        }
        .time-wheel::-webkit-scrollbar {
            display: none;
        }
        .time-item {
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            scroll-snap-align: center;
            transition: all 0.2s;
            font-size: 18px;
            color: #727687;
        }
        .time-item.active {
            font-size: 24px;
            font-weight: 700;
            color: #0050cb;
            transform: scale(1.1);
        }
        .time-item.blur {
            filter: blur(1px);
            opacity: 0.5;
        }
        .glass-modal {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }
        .calendar-day {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 9999px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
        }
        .calendar-day:hover:not(.empty) {
            background-color: #f0f1f2;
        }
        .calendar-day.selected {
            background-color: #0050cb !important;
            color: #ffffff !important;
            font-weight: 700;
        }
        .calendar-day.today {
            color: #0050cb;
            font-weight: 700;
            background-color: #0050cb11;
        }
        .calendar-day.empty {
            cursor: default;
        }
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom);
        }
    </style>
</head>
<body class="flex flex-col min-h-screen overflow-x-hidden bg-background">
<!-- Top Navigation Header -->
<header class="bg-surface sticky top-0 z-40 flex justify-between items-center w-full px-margin-mobile h-16 transition-colors border-b border-outline-variant/10">
<button class="text-on-surface-variant hover:bg-surface-container-low p-2 rounded-lg transition-all active:scale-95">
<span class="font-title-md text-title-md">취소</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary">일정 추가</h1>
<button class="text-primary font-bold hover:bg-primary-container/10 p-2 px-4 rounded-lg transition-all active:scale-95">
<span class="font-title-md text-title-md">완료</span>
</button>
</header>
<main class="flex-grow px-margin-mobile py-stack-lg max-w-2xl mx-auto w-full pb-safe">
<div class="space-y-stack-lg">
<!-- Title Input Section -->

</div>
</section>
<!-- Category Selection Section -->
<section class="space-y-stack-md">

<span class="font-label-md text-label-md">운동</span>
<div class="edit-trigger absolute -top-1 -right-1 w-7 h-7 bg-white rounded-full flex items-center justify-center shadow-lg border border-outline-variant/20 z-10">
<span class="material-symbols-outlined text-primary text-[16px]">edit</span>
</div>
</button>
<button class="category-chip group flex flex-col items-center justify-center p-4 rounded-2xl border transition-all relative" data-color="#fe9400" data-icon="menu_book" data-id="2" data-name="공부">
<span class="material-symbols-outlined mb-2 text-3xl">menu_book</span>
<span class="font-label-md text-label-md">공부</span>
<div class="edit-trigger absolute -top-1 -right-1 w-7 h-7 bg-white rounded-full flex items-center justify-center shadow-lg border border-outline-variant/20 z-10">
<span class="material-symbols-outlined text-primary text-[16px]">edit</span>
</div>
</button>
<button class="category-chip group flex flex-col items-center justify-center p-4 rounded-2xl border transition-all relative" data-color="#b60009" data-icon="groups" data-id="3" data-name="동아리">

<span class="font-label-md text-label-md">동아리</span>
<div class="edit-trigger absolute -top-1 -right-1 w-7 h-7 bg-white rounded-full flex items-center justify-center shadow-lg border border-outline-variant/20 z-10">
<span class="material-symbols-outlined text-primary text-[16px]">edit</span>
</div>
</button>
<button class="category-chip active group flex flex-col items-center justify-center p-4 rounded-2xl border transition-all relative" data-color="#727687" data-icon="more_horiz" data-id="5" data-name="기타">
<span class="material-symbols-outlined mb-2 text-3xl">more_horiz</span>
<span class="font-label-md text-label-md">기타</span>
<div class="edit-trigger absolute -top-1 -right-1 w-7 h-7 bg-white rounded-full flex items-center justify-center shadow-lg border border-outline-variant/20 z-10">
<span class="material-symbols-outlined text-primary text-[16px]">edit</span>
</div>
</button>

<!-- Date & Time Section -->

<div class="space-y-4">

</div>

</div>
</div>
<div class="hidden flex items-center gap-2 px-3 py-2 bg-error-container/20 rounded-lg" id="timeWarning">

</div>

</main>
<!-- Calendar Modal Overlay -->

</button>

</button>
</div>
</div>
<div class="p-6">

</div>

<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant">색상 선택</label>
<div class="grid grid-cols-8 gap-3 py-2" id="colorSelectionGrid">
<button class="color-choice h-8 w-8 rounded-full transition-all active:scale-90" data-color="#0050cb" style="background-color: #0050cb;"></button>
<button class="color-choice h-8 w-8 rounded-full transition-all active:scale-90" data-color="#fe9400" style="background-color: #fe9400;"></button>
<button class="color-choice h-8 w-8 rounded-full transition-all active:scale-90" data-color="#ba1a1a" style="background-color: #ba1a1a;"></button>
<button class="color-choice h-8 w-8 rounded-full transition-all active:scale-90" data-color="#2e7d32" style="background-color: #2e7d32;"></button>
<button class="color-choice h-8 w-8 rounded-full transition-all active:scale-90" data-color="#673ab7" style="background-color: #673ab7;"></button>
<button class="color-choice h-8 w-8 rounded-full transition-all active:scale-90" data-color="#727687" style="background-color: #727687;"></button>
</div>
</div>
<div class="flex flex-col gap-3 pt-4 pb-6">
<button class="w-full bg-error/10 text-error py-4 rounded-2xl font-title-md text-title-md hover:bg-error/20 transition-all active:scale-95" id="deleteCategoryBtn">삭제하기</button>
<button class="w-full bg-primary text-on-primary py-4 rounded-2xl font-title-md text-title-md hover:brightness-110 shadow-lg shadow-primary/20 transition-all active:scale-95" id="submitCategoryBtn">수정</button>
</div>
</div>
</div>
</div>
<!-- Delete Modal -->
<div class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[100] flex items-center justify-center px-margin-mobile hidden transition-opacity duration-300 opacity-0" id="confirmDeleteModal" onclick="handleBackdropClick(event, 'confirmDeleteModal', closeDeleteModal)">
<div class="bg-surface rounded-3xl p-6 w-full max-w-[320px] space-y-6 shadow-2xl modal-animate-in" onclick="event.stopPropagation()">
<div class="space-y-2 text-center">
<h4 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface font-bold">정말 이 카테고리를 삭제할까요?</h4>
<p class="font-body-md text-body-md text-on-surface-variant">해당 카테고리를 사용하는 일정은 유지되지만 카테고리는 제거됩니다.</p>
</div>
<div class="grid grid-cols-2 gap-3">
<button class="py-3.5 rounded-2xl border border-outline-variant font-title-md text-on-surface-variant hover:bg-surface-container-low transition-all active:scale-95" id="cancelDeleteBtn">취소</button>
<button class="py-3.5 rounded-2xl bg-error text-on-error font-title-md shadow-lg shadow-error/20 hover:brightness-110 transition-all active:scale-95" id="confirmDeleteBtn">삭제</button>
</div>
</div>
</div>
<script>
    const state = {
        mode: 'create',
        currentId: null,
        selectedIcon: '',
        selectedColor: '',
        startTime: { h: 9, m: 0 },
        endTime: { h: 10, m: 0 },
        selectedDate: new Date(),
        tempSelectedDate: new Date(),
        viewDate: new Date(),
        activePickerMode: null,
        categories: [
            { id: 1, name: '운동', icon: 'fitness_center', color: '#0050cb' },
            { id: 2, name: '공부', icon: 'menu_book', color: '#fe9400' },
            { id: 3, name: '동아리', icon: 'groups', color: '#b60009' },
            { id: 5, name: '기타', icon: 'more_horiz', color: '#727687' }
        ]
    };

    // Generic backdrop click handler
    function handleBackdropClick(e, overlayId, closeFn) {
        if (e.target.id === overlayId) {
            closeFn();
        }
    }

    // --- Calendar Logic ---
    function renderCalendar() {
        const grid = document.getElementById('calendarGrid');
        const monthYearText = document.getElementById('currentMonthYear');
        const year = state.viewDate.getFullYear();
        const month = state.viewDate.getMonth();
        monthYearText.textContent = `${year}년 ${month + 1}월`;
        const firstDay = new Date(year, month, 1).getDay();
        const lastDate = new Date(year, month + 1, 0).getDate();
        grid.innerHTML = '';
        for (let i = 0; i < firstDay; i++) {
            const empty = document.createElement('div');
            empty.className = 'calendar-day empty';
            grid.appendChild(empty);
        }
        const today = new Date();
        today.setHours(0,0,0,0);
        for (let day = 1; day <= lastDate; day++) {
            const dayEl = document.createElement('div');
            dayEl.className = 'calendar-day';
            dayEl.textContent = day;
            const curDate = new Date(year, month, day);
            if (curDate.getTime() === today.getTime()) dayEl.classList.add('today');
            if (curDate.getFullYear() === state.tempSelectedDate.getFullYear() &&
                curDate.getMonth() === state.tempSelectedDate.getMonth() &&
                curDate.getDate() === state.tempSelectedDate.getDate()) {
                dayEl.classList.add('selected');
            }
            dayEl.onclick = () => {
                state.tempSelectedDate = new Date(year, month, day);
                renderCalendar();
            };
            grid.appendChild(dayEl);
        }
    }

    function changeMonth(delta) {
        state.viewDate.setMonth(state.viewDate.getMonth() + delta);
        renderCalendar();
    }

    function openCalendarModal() {
        state.tempSelectedDate = new Date(state.selectedDate);
        state.viewDate = new Date(state.selectedDate);
        const overlay = document.getElementById('calendarModalOverlay');
        overlay.classList.remove('hidden');
        renderCalendar();
        setTimeout(() => overlay.classList.add('opacity-100'), 10);
    }

    function closeCalendarModal() {
        const overlay = document.getElementById('calendarModalOverlay');
        overlay.classList.remove('opacity-100');
        setTimeout(() => overlay.classList.add('hidden'), 300);
    }

    function confirmDate() {
        state.selectedDate = new Date(state.tempSelectedDate);
        updateDateDisplay();
        closeCalendarModal();
    }

    function updateDateDisplay() {
        const y = state.selectedDate.getFullYear();
        const m = state.selectedDate.getMonth() + 1;
        const d = state.selectedDate.getDate();
        document.getElementById('selectedDateText').textContent = `${y}년 ${m}월 ${d}일`;
        updateDDay();
    }

    function updateDDay() {
        const now = new Date();
        now.setHours(0,0,0,0);
        const target = new Date(state.selectedDate);
        target.setHours(0,0,0,0);
        const diffTime = target - now;
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        const display = document.getElementById('dDayDisplay');
        if (diffDays === 0) display.textContent = 'D-Day';
        else if (diffDays > 0) display.textContent = `D-${diffDays}`;
        else display.textContent = `D+${Math.abs(diffDays)}`;
    }

    // --- Time Picker Logic ---
    const hourWheel = document.getElementById('hourWheel');
    const minuteWheel = document.getElementById('minuteWheel');
    const timePickerOverlay = document.getElementById('timePickerOverlay');
    const timePickerSheet = document.getElementById('timePickerSheet');

    function initTimeWheels() {
        let hourHtml = '<div class="h-20"></div>';
        for(let i=0; i<24; i++) {
            const val = i.toString().padStart(2, '0');
            hourHtml += `<div class="time-item" data-value="${i}">${val}</div>`;
        }
        hourHtml += '<div class="h-20"></div>';
        hourWheel.innerHTML = hourHtml;
        let minuteHtml = '<div class="h-20"></div>';
        for(let i=0; i<60; i += 5) {
            const val = i.toString().padStart(2, '0');
            minuteHtml += `<div class="time-item" data-value="${i}">${val}</div>`;
        }
        minuteHtml += '<div class="h-20"></div>';
        minuteWheel.innerHTML = minuteHtml;
    }

    function openTimePicker(mode) {
        state.activePickerMode = mode;
        document.getElementById('pickerTitle').textContent = mode === 'start' ? '시작 시간 설정' : '종료 시간 설정';
        timePickerOverlay.classList.remove('hidden');
        setTimeout(() => {
            timePickerOverlay.classList.add('opacity-100');
            timePickerSheet.classList.add('open');
        }, 10);
        const initialTime = mode === 'start' ? state.startTime : state.endTime;
        scrollToValue('hour', initialTime.h);
        scrollToValue('minute', initialTime.m);
        updateWheelVisuals();
    }

    function closeTimePicker() {
        timePickerSheet.classList.remove('open');
        timePickerOverlay.classList.remove('opacity-100');
        setTimeout(() => timePickerOverlay.classList.add('hidden'), 400);
    }

    function scrollToValue(wheelType, value) {
        const wheel = wheelType === 'hour' ? hourWheel : minuteWheel;
        const items = wheel.querySelectorAll('.time-item');
        let target = 0;
        items.forEach((item, index) => {
            if(parseInt(item.dataset.value) === value) target = index;
        });
        wheel.scrollTop = target * 40;
    }

    function handleWheelScroll(wheelType) {
        updateWheelVisuals();
    }

    function updateWheelVisuals() {
        [hourWheel, minuteWheel].forEach(wheel => {
            const scrollTop = wheel.scrollTop;
            const activeIndex = Math.round(scrollTop / 40);
            const items = wheel.querySelectorAll('.time-item');
            items.forEach((item, index) => {
                item.classList.remove('active', 'blur');
                const diff = Math.abs(index - activeIndex);
                if (diff === 0) item.classList.add('active');
                else if (diff === 1) item.classList.add('blur');
            });
        });
    }

    function confirmTime() {
        const hItems = hourWheel.querySelectorAll('.time-item');
        const hIndex = Math.round(hourWheel.scrollTop / 40);
        const h = parseInt(hItems[hIndex]?.dataset.value || 0);
        const mItems = minuteWheel.querySelectorAll('.time-item');
        const mIndex = Math.round(minuteWheel.scrollTop / 40);
        const m = parseInt(mItems[mIndex]?.dataset.value || 0);
        if (state.activePickerMode === 'start') {
            state.startTime = { h, m };
            document.getElementById('startTimeText').textContent = `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}`;
        } else {
            state.endTime = { h, m };
            document.getElementById('endTimeText').textContent = `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}`;
        }
        validateTimes();
        closeTimePicker();
    }

    function setQuickTime(h, m) {
        scrollToValue('hour', h);
        scrollToValue('minute', m);
        updateWheelVisuals();
    }

    function validateTimes() {
        const startTotal = state.startTime.h * 60 + state.startTime.m;
        const endTotal = state.endTime.h * 60 + state.endTime.m;
        const warning = document.getElementById('timeWarning');
        const endContainer = document.getElementById('endTimeContainer');
        if (endTotal <= startTotal) {
            warning.classList.remove('hidden');
            endContainer.classList.add('border-error/20');
            endContainer.classList.remove('border-transparent');
        } else {
            warning.classList.add('hidden');
            endContainer.classList.remove('border-error/20');
            endContainer.classList.add('border-transparent');
        }
    }

    // --- Category Logic ---
    const categoryOverlay = document.getElementById('categorySheetOverlay');
    const categorySheet = document.getElementById('categorySheet');
    const addBtn = document.getElementById('addCategoryBtn');
    const submitBtn = document.getElementById('submitCategoryBtn');
    const deleteBtn = document.getElementById('deleteCategoryBtn');
    const nameInput = document.getElementById('categoryNameInput');
    const container = document.getElementById('categoryContainer');
    const iconChoices = document.querySelectorAll('.icon-choice');
    const colorChoices = document.querySelectorAll('.color-choice');

    function openCategorySheet(mode, categoryId = null) {
        state.mode = mode;
        state.currentId = categoryId;
        categoryOverlay.classList.remove('hidden');
        setTimeout(() => {
            categoryOverlay.classList.add('opacity-100');
            categorySheet.classList.add('open');
        }, 10);
        if (mode === 'edit') {
            const cat = state.categories.find(c => c.id === parseInt(categoryId));
            document.getElementById('sheetTitle').textContent = '카테고리 수정';
            nameInput.value = cat.name;
            deleteBtn.classList.remove('hidden');
            submitBtn.textContent = '수정';
            selectIcon(cat.icon);
            selectColor(cat.color);
        } else {
            document.getElementById('sheetTitle').textContent = '카테고리 추가';
            nameInput.value = '';
            deleteBtn.classList.add('hidden');
            submitBtn.textContent = '추가 완료';
            resetSelection();
        }
    }

    function closeCategorySheet() {
        categorySheet.classList.remove('open');
        categoryOverlay.classList.remove('opacity-100');
        setTimeout(() => categoryOverlay.classList.add('hidden'), 400);
    }

    function selectIcon(iconName) {
        state.selectedIcon = iconName;
        iconChoices.forEach(btn => btn.classList.toggle('selected', btn.dataset.icon === iconName));
    }

    function selectColor(colorCode) {
        state.selectedColor = colorCode;
        colorChoices.forEach(btn => btn.classList.toggle('selected', btn.dataset.color === colorCode));
    }

    function resetSelection() {
        state.selectedIcon = '';
        state.selectedColor = '';
        iconChoices.forEach(btn => btn.classList.remove('selected'));
        colorChoices.forEach(btn => btn.classList.remove('selected'));
    }

    function updateCategoryStyles(btn, cat) {
        const isActive = btn.classList.contains('active');
        btn.style.borderColor = isActive ? cat.color : `${cat.color}33`;
        btn.style.backgroundColor = isActive ? `${cat.color}22` : `${cat.color}11`;
        btn.innerHTML = `
            <span class="material-symbols-outlined mb-2 text-3xl" style="color: ${cat.color}">${cat.icon}</span>
            <span class="font-label-md text-label-md" style="color: ${cat.color}">${cat.name}</span>
            <div class="edit-trigger absolute -top-1 -right-1 w-7 h-7 bg-white rounded-full flex items-center justify-center shadow-lg border border-outline-variant/20 z-10">
                <span class="material-symbols-outlined text-primary text-[16px]">edit</span>
            </div>
        `;
    }

    addBtn.addEventListener('click', () => openCategorySheet('create'));

    iconChoices.forEach(btn => btn.addEventListener('click', () => selectIcon(btn.dataset.icon)));
    colorChoices.forEach(btn => btn.addEventListener('click', () => selectColor(btn.dataset.color)));

    container.addEventListener('click', (e) => {
        const editBtn = e.target.closest('.edit-trigger');
        const chip = e.target.closest('.category-chip');
        if (editBtn) {
            e.stopPropagation();
            openCategorySheet('edit', editBtn.closest('.category-chip').dataset.id);
            return;
        }
        if (chip) {
            document.querySelectorAll('.category-chip').forEach(c => {
                c.classList.remove('active');
                const color = c.dataset.color;
                c.style.backgroundColor = `${color}11`;
                c.style.borderColor = `${color}33`;
                const iconSpan = c.querySelector('.material-symbols-outlined:not(.text-primary)');
                const nameSpan = c.querySelector('.font-label-md');
                if(iconSpan) iconSpan.style.color = color;
                if(nameSpan) nameSpan.style.color = color;
            });
            chip.classList.add('active');
            const activeColor = chip.dataset.color;
            chip.style.backgroundColor = `${activeColor}22`;
            chip.style.borderColor = activeColor;
        }
    });

    submitBtn.addEventListener('click', () => {
        const name = nameInput.value.trim();
        if (!name || !state.selectedIcon || !state.selectedColor) return;
        if (state.mode === 'create') {
            const newCat = { id: Date.now(), name, icon: state.selectedIcon, color: state.selectedColor };
            state.categories.push(newCat);
            const btn = document.createElement('button');
            btn.className = `category-chip group flex flex-col items-center justify-center p-4 rounded-2xl border transition-all relative`;
            btn.dataset.id = newCat.id;
            btn.dataset.name = newCat.name;
            btn.dataset.icon = newCat.icon;
            btn.dataset.color = newCat.color;
            updateCategoryStyles(btn, newCat);
            container.insertBefore(btn, addBtn);
        } else {
            const cat = state.categories.find(c => c.id === parseInt(state.currentId));
            Object.assign(cat, { name, icon: state.selectedIcon, color: state.selectedColor });
            const btn = container.querySelector(`[data-id="${cat.id}"]`);
            btn.dataset.name = cat.name;
            btn.dataset.icon = cat.icon;
            btn.dataset.color = cat.color;
            updateCategoryStyles(btn, cat);
        }
        closeCategorySheet();
    });

    // --- Delete Modal Logic ---
    const deleteModalOverlay = document.getElementById('confirmDeleteModal');
    
    function openDeleteModal() {
        deleteModalOverlay.classList.remove('hidden');
        setTimeout(() => deleteModalOverlay.classList.add('opacity-100'), 10);
    }

    function closeDeleteModal() {
        deleteModalOverlay.classList.remove('opacity-100');
        setTimeout(() => deleteModalOverlay.classList.add('hidden'), 300);
    }

    deleteBtn.addEventListener('click', openDeleteModal);
    document.getElementById('cancelDeleteBtn').addEventListener('click', closeDeleteModal);
    document.getElementById('confirmDeleteBtn').addEventListener('click', () => {
        const catId = parseInt(state.currentId);
        state.categories = state.categories.filter(c => c.id !== catId);
        const btn = container.querySelector(`[data-id="${catId}"]`);
        if (btn) btn.remove();
        closeDeleteModal();
        closeCategorySheet();
    });

    document.getElementById('datePickerTrigger').addEventListener('click', openCalendarModal);

    function init() {
        initTimeWheels();
        updateDateDisplay();
        document.querySelectorAll('.category-chip[data-id]').forEach(chip => {
            updateCategoryStyles(chip, {
                id: chip.dataset.id,
                name: chip.dataset.name,
                icon: chip.dataset.icon,
                color: chip.dataset.color
            });
        });
        validateTimes();
    }

    init();
</script>
</body></html>
