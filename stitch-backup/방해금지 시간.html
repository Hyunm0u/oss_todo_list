<script>
    let currentTarget = 'start'; // 'start' or 'end'
    let startTime = "09:00";
    let endTime = "10:30";
    let activeDays = [];

    // Initialize wheels
    const hourWheel = document.getElementById('hour-wheel');
    const minuteWheel = document.getElementById('minute-wheel');

    function populateWheels() {
        hourWheel.innerHTML = '';
        minuteWheel.innerHTML = '';
        
        for (let i = 0; i < 24; i++) {
            const h = i.toString().padStart(2, '0');
            const div = document.createElement('div');
            div.className = 'picker-item snap-center';
            div.innerText = h;
            div.setAttribute('data-val', h);
            hourWheel.appendChild(div);
        }

        for (let i = 0; i < 60; i += 5) {
            const m = i.toString().padStart(2, '0');
            const div = document.createElement('div');
            div.className = 'picker-item snap-center';
            div.innerText = m;
            div.setAttribute('data-val', m);
            minuteWheel.appendChild(div);
        }
        
        // Add listeners for visual feedback
        [hourWheel, minuteWheel].forEach(wheel => {
            wheel.addEventListener('scroll', () => {
                const items = wheel.querySelectorAll('.picker-item');
                const wheelRect = wheel.getBoundingClientRect();
                const center = wheelRect.top + wheelRect.height / 2;
                
                items.forEach(item => {
                    const itemRect = item.getBoundingClientRect();
                    const itemCenter = itemRect.top + itemRect.height / 2;
                    if (Math.abs(center - itemCenter) < 22) {
                        item.classList.add('selected');
                    } else {
                        item.classList.remove('selected');
                    }
                });
            });
        });
    }

    function openTimePicker(type) {
        currentTarget = type;
        document.getElementById('picker-title').innerText = type === 'start' ? '시작 시간 설정' : '종료 시간 설정';
        const modal = document.getElementById('time-picker-modal');
        modal.classList.remove('hidden');
        
        const currentVal = type === 'start' ? startTime : endTime;
        const [h, m] = currentVal.split(':');
        
        // Scroll to current
        setTimeout(() => {
            const hItem = hourWheel.querySelector(`[data-val="${h}"]`);
            const mVal = (Math.round(parseInt(m) / 5) * 5).toString().padStart(2, '0');
            const mItem = minuteWheel.querySelector(`[data-val="${mVal === '60' ? '00' : mVal}"]`);
            
            if (hItem) hItem.scrollIntoView({ block: 'center' });
            if (mItem) mItem.scrollIntoView({ block: 'center' });
        }, 100);
    }

    function closeTimePicker() {
        document.getElementById('time-picker-modal').classList.add('hidden');
    }

    function confirmTime() {
        const selectedHour = hourWheel.querySelector('.selected')?.getAttribute('data-val') || '00';
        const selectedMinute = minuteWheel.querySelector('.selected')?.getAttribute('data-val') || '00';
        const timeStr = `${selectedHour}:${selectedMinute}`;
        
        if (currentTarget === 'start') {
            startTime = timeStr;
            document.getElementById('start-time-display').innerText = timeStr;
        } else {
            endTime = timeStr;
            document.getElementById('end-time-display').innerText = timeStr;
        }
        
        validateTimes();
        updatePreview();
        closeTimePicker();
    }

    function quickSelect(time) {
        const [h, m] = time.split(':');
        const hItem = hourWheel.querySelector(`[data-val="${h}"]`);
        const mItem = minuteWheel.querySelector(`[data-val="${m}"]`);
        if (hItem) hItem.scrollIntoView({ behavior: 'smooth', block: 'center' });
        if (mItem) mItem.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function validateTimes() {
        const start = parseInt(startTime.replace(':', ''));
        const end = parseInt(endTime.replace(':', ''));
        const warning = document.getElementById('time-warning');
        
        if (end < start) {
            warning.classList.remove('hidden');
            document.getElementById('end-time-trigger').classList.add('border-error');
        } else {
            warning.classList.add('hidden');
            document.getElementById('end-time-trigger').classList.remove('border-error');
        }
    }

    function toggleDay(btn, day) {
        const isSelected = btn.classList.contains('bg-primary-container');
        if (isSelected) {
            btn.classList.remove('bg-primary-container', 'text-on-primary-container', 'border-primary');
            activeDays = activeDays.filter(d => d !== day);
        } else {
            btn.classList.add('bg-primary-container', 'text-on-primary-container', 'border-primary');
            activeDays.push(day);
        }
        updatePreview();
    }

    function updateColor(colorHex, btn) {
        document.getElementById('preview-accent').style.backgroundColor = colorHex;
        document.getElementById('preview-border').style.backgroundColor = colorHex;
        document.querySelectorAll('.color-swatch').forEach(swatch => swatch.classList.remove('selected-color-ring'));
        btn.classList.add('selected-color-ring');
    }

    function updatePreview() {
        const nameInput = document.getElementById('schedule-name-input');
        const previewTitle = document.getElementById('preview-title');
        const previewSub = document.getElementById('preview-time-days');
        
        previewTitle.innerText = nameInput.value || '일정 이름';
        const dayString = activeDays.length > 0 ? activeDays.join(', ') : '';
        previewSub.innerText = `${startTime} - ${endTime}${dayString ? ' | ' + dayString : ''}`;
    }

    // Event Listeners
    document.getElementById('start-time-trigger').addEventListener('click', () => openTimePicker('start'));
    document.getElementById('end-time-trigger').addEventListener('click', () => openTimePicker('end'));
    document.getElementById('schedule-name-input').addEventListener('input', updatePreview);

    // Initial Load
    populateWheels();
    // Set some default days for visual consistency with previous screenshot
    const dayBtns = document.querySelectorAll('.day-btn');
    const initialDays = ['월', '수', '금'];
    dayBtns.forEach(btn => {
        if (initialDays.includes(btn.innerText)) {
            toggleDay(btn, btn.innerText);
        }
    });
    updatePreview();
</script>


</body></html>
