<script>
        // Micro-interactions
        const darkModeToggle = document.getElementById('darkModeToggle');
        darkModeToggle.addEventListener('change', (e) => {
            if (e.target.checked) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        });

        // Add active feedback for buttons
        const listItems = document.querySelectorAll('button, a');
        listItems.forEach(item => {
            item.addEventListener('touchstart', () => item.style.transform = 'scale(0.98)');
            item.addEventListener('touchend', () => item.style.transform = 'scale(1)');
        });
    </script>
